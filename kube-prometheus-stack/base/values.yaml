# Chart default values, override as needed.
# https://github.com/prometheus-community/helm-charts/blob/kube-prometheus-stack-88.5.4/charts/kube-prometheus-stack/values.yaml

prometheus:
  prometheusSpec:
    # 35d so the 30d SLO windows in ts-telemetry-demo (docs/SLO.md) have a full
    # window of data. The chart default is 10d.
    retention: 35d
    # Persist the TSDB across pod restarts; without this Prometheus uses
    # emptyDir and the 35d of history is lost on every reschedule.
    storageSpec:
      volumeClaimTemplate:
        spec:
          # gp3 is the lab cluster's default class (gp2 isn't created on
          # current EKS versions, so a gp2 claim would stay Pending forever).
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

grafana:
  # The chart's default admin password is public knowledge; this Secret is
  # created with a random password by the lab's Terraform before Argo CD syncs.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  grafana.ini:
    server:
      root_url: https://grafana.lab.codebee.org

  # Joins the lab's shared ALB (group set by the "alb" IngressClassParams);
  # TLS comes from the wildcard ACM cert and DNS from external-dns.
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
    hosts:
      - grafana.lab.codebee.org
    path: /

# EKS runs the control plane, so etcd, the scheduler and the controller-manager
# can't be scraped, and kube-proxy only binds its metrics to localhost. Left on,
# they show up as permanently down targets with alerts firing.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

alertmanager:
  alertmanagerSpec:
    # Created by the lab's Terraform from its slack_webhook_url variable, so the
    # webhook URL stays out of this public repo. Mounted at
    # /etc/alertmanager/secrets/alertmanager-slack/.
    secrets:
      - alertmanager-slack

  # Merged over the chart's default config: inhibit_rules are kept, while
  # route and receivers (lists) are replaced, so the defaults are restated.
  config:
    route:
      group_by: ["namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "null"
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: slack-eng-alerts
          matchers:
            - alertname = "KubePodCrashLooping"
          # One Slack thread of updates per crashing pod, re-sent every 4h
          # while it keeps crashing.
          group_by: ["namespace", "pod"]
          repeat_interval: 4h
    receivers:
      - name: "null"
      - name: slack-eng-alerts
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: "#eng-alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}: {{ .CommonLabels.namespace }}/{{ .CommonLabels.pod }}'
            text: |-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              <{{ .Annotations.runbook_url }}|Runbook>
              {{ end }}
